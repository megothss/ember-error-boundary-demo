name: CI

# No lint job on this branch: the released Prettier and ember-template-lint
# parsers do not understand the proposed `{{catch}}` syntax yet.
on:
  push:
    branches:
      - keyword
  pull_request: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ember-fork
        with:
          ref: try-keyword
      - name: Run Tests
        run: pnpm test
